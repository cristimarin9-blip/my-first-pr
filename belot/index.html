<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Belot Scorekeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a paper score sheet split into one column per team or player, the hand entry form under it, history ledger last. */
:root {
  --bg: #eef1ee;
  --paper: #fbfcfa;
  --ink: #1b2421;
  --muted: #5d6b66;
  --line: #d3dbd7;
  --felt: #1f5a45;
  --felt-soft: #e1ede7;
  --on-felt: #ffffff;
  --red: #b3262e;
  --red-soft: #f7e3e4;
  --gold: #8a6510;
  --gold-soft: #f6ecd2;
  --card: #ffffff;
  --card-edge: #b9c4bf;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1412; --paper: #151f1c; --ink: #e5ece9; --muted: #96a59f; --line: #2a3833;
    --felt: #5bb38f; --felt-soft: #1b3229; --on-felt: #0d1412;
    --red: #ec7a7f; --red-soft: #3a1d20; --gold: #e0b75a; --gold-soft: #33290f;
    --card: #e9eeeb; --card-edge: #5d6b66;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1412; --paper: #151f1c; --ink: #e5ece9; --muted: #96a59f; --line: #2a3833;
  --felt: #5bb38f; --felt-soft: #1b3229; --on-felt: #0d1412;
  --red: #ec7a7f; --red-soft: #3a1d20; --gold: #e0b75a; --gold-soft: #33290f;
  --card: #e9eeeb; --card-edge: #5d6b66;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 20px 48px; padding-inline: 16px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.15rem; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--felt); outline-offset: 2px; }
.label { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; left: -9999px; }
[hidden] { display: none !important; }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.target { display: flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); }
.target input { width: 4.5em; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }

.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 14px; font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--felt); color: var(--on-felt); border-color: var(--felt); }
.btn.danger { color: var(--red); }

/* Setup */
.setup { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; }
.setup .field { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.setup-note { font-size: .82rem; color: var(--muted); }

/* Score sheet */
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.sheet-head { display: grid; }
.team { padding: 16px 18px 14px; display: grid; gap: 6px; min-width: 0; }
.team + .team { border-left: 2px solid var(--ink); }
.team input.name {
  border: 0; border-bottom: 1px dashed transparent; background: transparent; padding: 0; width: 100%;
  font-weight: 600; font-size: .95rem; color: var(--muted); min-width: 0;
}
.team input.name:hover, .team input.name:focus { border-bottom-color: var(--line); outline: none; }
.total { font-family: var(--font-display); font-size: clamp(2.6rem, 11vw, 3.6rem); line-height: 1; }
.sheet.many .total { font-size: clamp(1.8rem, 7vw, 2.8rem); }
.sheet.many .team { padding: 14px 12px 12px; }
.bar { height: 6px; border-radius: 3px; background: var(--felt-soft); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--felt); transition: width .3s ease; }
.togo { font-size: .82rem; color: var(--muted); }
.team.leader .total { color: var(--felt); }
.banner {
  border-top: 1px solid var(--line); padding: 12px 18px; display: flex; gap: 12px; align-items: center;
  justify-content: space-between; flex-wrap: wrap; background: var(--felt-soft);
}
.banner strong { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; }
.hangnote { border-top: 1px solid var(--line); padding: 10px 18px; font-size: .88rem; background: var(--gold-soft); color: var(--gold); }

/* Hand form */
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 18px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.field { display: grid; gap: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 7px 14px;
  font-weight: 600; display: inline-flex; align-items: center; gap: 6px; min-height: 38px;
}
.chip:hover:not(:disabled) { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--felt); color: var(--on-felt); border-color: var(--felt); }
.chip .sym { font-size: 1.15rem; line-height: 1; }
.chip .sym.red { color: var(--red); }
.chip[aria-pressed="true"] .sym.red { color: inherit; }
.chip:disabled { opacity: .4; cursor: not-allowed; }

.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.col { display: grid; gap: 10px; align-content: start; min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 8px; }
.col h3 { margin: 0; font-size: .95rem; font-weight: 700; overflow-wrap: anywhere; }
.col h3 .bidtag { font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--felt); margin-left: 6px; }
.tricks { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tricks input {
  width: 100%; max-width: 7em; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--paper); font-size: 1.15rem; font-variant-numeric: tabular-nums;
}
.tricks input:disabled { opacity: .6; }
.remaining { font-size: .82rem; color: var(--muted); }
.capot { display: flex; align-items: center; gap: 6px; font-size: .9rem; cursor: pointer; }
.capot small { color: var(--muted); }

.decl-btns { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.decl-btns button {
  border: 1px dashed var(--line); background: transparent; border-radius: 8px; padding: 7px 8px 6px;
  display: grid; gap: 5px; justify-items: start; text-align: left; font-size: .8rem; font-weight: 600; line-height: 1.2;
}
.decl-btns button:hover:not(:disabled) { border-style: solid; border-color: var(--felt); }
.decl-btns button:disabled { opacity: .35; cursor: not-allowed; }
.decl-btns button small { font-weight: 500; color: var(--muted); }
.decl-list { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; }
.tag {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; padding: 3px 4px 3px 6px;
  background: var(--felt-soft); font-size: .82rem; font-weight: 600;
}
.tag.belot { background: var(--red-soft); }
.tag button { border: 0; background: transparent; padding: 0 4px; font-size: 1rem; line-height: 1; color: inherit; opacity: .7; }
.tag button:hover { opacity: 1; }
.empty-decl { font-size: .82rem; color: var(--muted); }

/* Playing-card icons */
.cards { display: inline-flex; align-items: center; }
.card {
  display: inline-grid; grid-template-rows: auto auto; place-items: center; align-content: center;
  width: 1.7em; height: 2.2em; border: 1px solid var(--card-edge); border-radius: 3px;
  background: var(--card); color: #1b2421; font-size: .72rem; font-weight: 700; line-height: 1;
  box-shadow: 0 1px 0 rgba(0, 0, 0, .08); font-variant-numeric: tabular-nums;
}
.card + .card { margin-left: -.3em; }
.card.ten { letter-spacing: -.08em; font-size: .64rem; }
.card.red { color: #b3262e; }
.card i { font-style: normal; font-size: .95em; }
.cards.lg .card { font-size: .85rem; }
.cards.lg .card.ten { font-size: .76rem; }
.cards.lg .card + .card { margin-left: -.3em; }

.preview {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  border-top: 1px solid var(--line); padding-top: 14px;
}
.preview-text { font-size: .92rem; min-width: 0; }
.preview-text b { font-variant-numeric: tabular-nums; }
.status { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; margin-right: 6px; }
.status.made { background: var(--felt-soft); color: var(--felt); }
.status.inside { background: var(--red-soft); color: var(--red); }
.status.hanging { background: var(--gold-soft); color: var(--gold); }

/* History ledger */
.ledger { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 8px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
td.pts, th.pts { text-align: right; white-space: nowrap; }
th.pts { max-width: 7em; overflow: hidden; text-overflow: ellipsis; }
td.pts .run { display: block; font-size: .78rem; color: var(--muted); }
td.pts.sep, th.pts.sep { border-left: 2px solid var(--ink); }
.hand-contract { font-weight: 600; white-space: nowrap; }
.hand-contract .red { color: var(--red); }
.hand-meta { font-size: .8rem; color: var(--muted); min-width: 12em; }
td.del { width: 1%; }
td.del button { border: 0; background: transparent; color: var(--muted); padding: 2px 6px; font-size: 1.1rem; }
td.del button:hover { color: var(--red); }
.empty { padding: 24px 8px; color: var(--muted); text-align: center; }

details.rules { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; }
details.rules summary { cursor: pointer; font-family: var(--font-display); font-size: 1.05rem; }
.rules-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; margin-top: 14px; font-size: .9rem; }
.rules-grid h4 { margin: 0 0 8px; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.rules-grid dl { margin: 0; display: grid; grid-template-columns: auto 1fr auto; gap: 8px 10px; align-items: center; }
.rules-grid dt { display: contents; }
.rules-grid dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.rules-grid p { margin: 0 0 6px; }
.rules-wide { grid-column: 1 / -1; }

.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .9rem; }

@media (max-width: 560px) {
  .team { padding: 14px 12px; }
  .panel { padding: 14px; }
  .sheet.many .team { padding: 12px 8px; }
  .sheet.many .togo { font-size: .74rem; }
}
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Belot Scorekeeper</h1>
    <div class="top-actions">
      <label class="target" for="target">Play to <input id="target" type="number" min="1" step="1" class="num"></label>
      <span id="newGameBox"></span>
    </div>
  </header>

  <section class="setup" aria-label="Game setup">
    <div class="field">
      <span class="label">Play as</span>
      <div class="seg" id="modeSeg"></div>
    </div>
    <div class="field" id="playersField">
      <span class="label">Players</span>
      <div class="seg" id="playersSeg"></div>
    </div>
    <span class="setup-note" id="setupNote"></span>
  </section>

  <section class="sheet" id="sheet" aria-label="Score">
    <div class="sheet-head" id="sheetHead"></div>
    <div class="hangnote" id="hangNote" hidden></div>
    <div class="banner" id="banner" hidden></div>
  </section>

  <form class="panel" id="handForm" autocomplete="off">
    <div class="panel-head">
      <h2 id="handTitle">Hand 1</h2>
      <span class="label">Enter after the last trick</span>
    </div>

    <div class="field">
      <span class="label">Contract won by</span>
      <div class="seg" id="bidderSeg"></div>
    </div>

    <div class="field">
      <span class="label">Contract</span>
      <div class="seg" id="contractSeg"></div>
    </div>

    <div class="field">
      <span class="label">Double</span>
      <div class="seg" id="multSeg"></div>
    </div>

    <div class="cols" id="cols"></div>

    <div class="preview">
      <div class="preview-text" id="preview" aria-live="polite"></div>
      <button class="btn primary" id="addHand" type="submit">Add hand</button>
    </div>
  </form>

  <section class="panel" aria-labelledby="histTitle">
    <div class="panel-head">
      <h2 id="histTitle">Score sheet</h2>
      <button class="btn" id="undo" type="button">Undo last hand</button>
    </div>
    <div class="ledger">
      <table>
        <thead><tr id="headRow"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <details class="rules" id="rules">
    <summary>Scoring reference</summary>
    <div class="rules-grid" id="rulesGrid"></div>
  </details>
</div>

<script>
(function () {
  "use strict";

  const CONTRACTS = {
    c:  { label: "Clubs",      sym: "♣", kind: "suit", red: false },
    d:  { label: "Diamonds",   sym: "♦", kind: "suit", red: true },
    h:  { label: "Hearts",     sym: "♥", kind: "suit", red: true },
    s:  { label: "Spades",     sym: "♠", kind: "suit", red: false },
    nt: { label: "No trumps",  sym: "",  kind: "nt",   red: false },
    at: { label: "All trumps", sym: "",  kind: "at",   red: false }
  };
  const CARD_TOTAL = { suit: 162, nt: 130, at: 258 };
  const SUITS = ["♠", "♥", "♦", "♣"];
  // `cards(trump)` lists what the combination is made of, as [rank, suit] pairs.
  const DECL = {
    t:  { label: "Tierce",     long: "Tierce, 3 in a row",  v: 20,  cards: (s) => ["7", "8", "9"].map((r) => [r, s]) },
    q:  { label: "Quarte",     long: "Quarte, 4 in a row",  v: 50,  cards: (s) => ["7", "8", "9", "10"].map((r) => [r, s]) },
    f:  { label: "Quint",      long: "Quint, 5+ in a row",  v: 100, cards: (s) => ["7", "8", "9", "10", "J"].map((r) => [r, s]) },
    cj: { label: "Four jacks", long: "Four jacks",          v: 200, cards: () => SUITS.map((s) => ["J", s]) },
    c9: { label: "Four nines", long: "Four nines",          v: 150, cards: () => SUITS.map((s) => ["9", s]) },
    c4: { label: "Four A/K/Q/10", long: "Four aces, kings, queens or tens", v: 100, cards: () => SUITS.map((s) => ["A", s]) },
    b:  { label: "Belot",      long: "Belot, K + Q of trumps", v: 20, cards: (s) => [["K", s], ["Q", s]] }
  };
  const CAPOT_BONUS = 90;
  const STORE_KEY = "belot-scorekeeper-v1";
  const DEFAULT_TEAMS = ["Us", "Them"];
  const DEFAULT_PLAYERS = ["Player 1", "Player 2", "Player 3", "Player 4"];

  const $ = (id) => document.getElementById(id);
  const range = (n) => Array.from({ length: n }, (_, i) => i);

  // ---------- scoring ----------

  // Raw points → game points. Suits round 7+ up; all trumps / no trumps round 5+ up.
  function toGame(raw, kind) {
    const threshold = kind === "suit" ? 6 : 4;
    raw = Math.round(raw);
    return Math.floor(raw / 10) + (raw % 10 > threshold ? 1 : 0);
  }

  // Works for any number of sides (2 teams, or 2–4 individual players).
  // The bidder must score more than every opponent. If inside, the bidder's points are
  // shared among the opponents; with two sides that means the defenders take everything.
  function scoreHand(h) {
    const kind = CONTRACTS[h.contract].kind;
    const n = h.tricks.length;
    const sides = range(n);
    const ntFactor = kind === "nt" ? 2 : 1;
    const capot = sides.map((t) => (h.capot === t ? CAPOT_BONUS : 0));
    const belot = sides.map((t) => kind === "nt" ? 0 : h.decl[t].filter((x) => x === "b").length * DECL.b.v);
    const decl = sides.map((t) => kind === "nt" ? 0 : h.decl[t].filter((x) => x !== "b").reduce((s, x) => s + DECL[x].v, 0));
    const pool = sides.map((t) => (h.tricks[t] + capot[t]) * ntFactor + decl[t]);
    const raw = sides.map((t) => pool[t] + belot[t]);

    const b = h.bidder;
    const opps = sides.filter((t) => t !== b);
    const best = Math.max(...opps.map((t) => raw[t]));
    const sum = pool.reduce((s, x) => s + x, 0);
    const award = sides.map(() => 0);
    let hangRaw = 0, status;
    if (raw[b] > best) {
      status = "made";
      if (h.mult > 1) award[b] = sum;
      else sides.forEach((t) => { award[t] = pool[t]; });
    } else if (raw[b] < best) {
      status = "inside";
      opps.forEach((t) => { award[t] = pool[t] + pool[b] / opps.length; });
    } else {
      status = "hanging";
      opps.forEach((t) => { award[t] = pool[t]; });
      hangRaw = pool[b];
    }
    const pts = sides.map((t) => toGame(award[t] + belot[t], kind) * h.mult);
    return { pts, raw, status, hang: toGame(hangRaw, kind) * h.mult };
  }

  function uniqueMax(arr) {
    const m = Math.max(...arr);
    return arr.filter((x) => x === m).length === 1 ? arr.indexOf(m) : null;
  }

  // Runs every hand in order: running totals, hanging points, and the winner.
  function computeGame(hands, target, n) {
    let totals = range(n).map(() => 0), carry = 0, winner = null;
    const rows = hands.map((h) => {
      const r = scoreHand(h);
      const pts = r.pts.slice();
      let carryIn = 0, carryTo = null;
      if (carry > 0) {
        const top = uniqueMax(pts);
        if (top !== null) { carryTo = top; pts[top] += carry; carryIn = carry; carry = 0; }
      }
      carry += r.hang;
      totals = totals.map((x, t) => x + pts[t]);
      if (winner === null && Math.max(...totals) >= target) winner = uniqueMax(totals);
      return { hand: h, result: r, pts, carryIn, carryTo, totals: totals.slice() };
    });
    return { rows, totals, carry, winner };
  }

  // ---------- state ----------

  let state = { mode: "teams", players: 3, teamNames: DEFAULT_TEAMS.slice(), playerNames: DEFAULT_PLAYERS.slice(), target: 151, hands: [] };
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (saved && Array.isArray(saved.hands)) {
      if (Array.isArray(saved.names) && !saved.teamNames) saved.teamNames = saved.names; // first version stored only team names
      delete saved.names;
      state = Object.assign(state, saved);
    }
  } catch (e) { /* storage unavailable: start fresh */ }

  function sideCount() { return state.mode === "teams" ? 2 : state.players; }
  function names() { return state.mode === "teams" ? state.teamNames : state.playerNames; }
  function sideName(t) {
    const fallback = state.mode === "teams" ? "Team " + (t + 1) : "Player " + (t + 1);
    return (names()[t] || "").trim() || fallback;
  }

  function freshDraft(prev) {
    const n = sideCount();
    return {
      bidder: prev && prev.bidder < n ? prev.bidder : 0,
      contract: prev ? prev.contract : "h",
      mult: 1,
      tricks: range(n).map(() => ""),
      manual: range(n).map(() => false),
      capot: null,
      decl: range(n).map(() => [])
    };
  }

  let draft = freshDraft();
  let confirmingNewGame = false;

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  function draftKind() { return CONTRACTS[draft.contract].kind; }
  function draftTotal() { return CARD_TOTAL[draftKind()]; }
  function trumpSuit(contract) { const c = CONTRACTS[contract]; return c.kind === "suit" ? c.sym : "♥"; }

  // Returns a hand object when the draft is complete, otherwise an error message.
  function draftToHand() {
    const total = draftTotal();
    const n = sideCount();
    let tricks;
    if (draft.capot !== null) {
      tricks = range(n).map((t) => (t === draft.capot ? total : 0));
    } else {
      if (draft.tricks.every((x) => x === "")) return { error: "Enter the trick points." };
      tricks = draft.tricks.map((x) => (x === "" ? 0 : Number(x)));
      if (tricks.some((x) => !Number.isInteger(x) || x < 0)) return { error: "Trick points must be whole numbers." };
      const sum = tricks.reduce((s, x) => s + x, 0);
      if (sum !== total) return { error: "Trick points must add up to " + total + " (now " + sum + ")." };
    }
    const kind = draftKind();
    return {
      hand: {
        bidder: draft.bidder,
        contract: draft.contract,
        mult: draft.mult,
        tricks,
        capot: draft.capot,
        decl: kind === "nt" ? range(n).map(() => []) : draft.decl.map((l) => l.slice())
      }
    };
  }

  // Fill in the last trick box automatically once every other side has a number.
  function autofillTricks(changed) {
    const n = sideCount();
    const total = draftTotal();
    const open = range(n).filter((t) => !draft.manual[t]);
    if (open.length === 1) {
      const last = open[0];
      const sum = range(n).filter((t) => t !== last).reduce((s, t) => s + (Number(draft.tricks[t]) || 0), 0);
      draft.tricks[last] = String(Math.max(0, total - sum));
    } else {
      open.forEach((t) => { if (t !== changed) draft.tricks[t] = ""; });
    }
  }

  // ---------- rendering helpers ----------

  function el(tag, attrs, children) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
    }
    (children || []).forEach((c) => n.append(c));
    return n;
  }

  function cardIcons(declKey, trump, large) {
    const list = DECL[declKey].cards(trump);
    return el("span", { class: "cards" + (large ? " lg" : ""), "aria-hidden": "true" }, list.map(([rank, suit]) =>
      el("span", { class: "card" + (suit === "♥" || suit === "♦" ? " red" : "") + (rank === "10" ? " ten" : "") }, [rank, el("i", { text: suit })])));
  }

  function contractLabel(h) {
    const c = CONTRACTS[h.contract];
    const frag = document.createDocumentFragment();
    if (c.kind === "suit") frag.append(el("span", { class: c.red ? "red" : "", text: c.sym + " " }));
    frag.append(c.label);
    if (h.mult === 2) frag.append(" ×2");
    if (h.mult === 4) frag.append(" ×4");
    return frag;
  }

  // ---------- rendering ----------

  function renderSetup() {
    const locked = state.hands.length > 0;
    const choose = (fn) => () => { fn(); draft = freshDraft(draft); save(); render(); };
    $("modeSeg").replaceChildren(...[["teams", "2 teams"], ["solo", "Individually"]].map(([m, label]) =>
      el("button", {
        type: "button", class: "chip", "aria-pressed": String(state.mode === m), disabled: locked,
        onclick: choose(() => { state.mode = m; })
      }, [label])));
    $("playersField").hidden = state.mode !== "solo";
    $("playersSeg").replaceChildren(...[2, 3, 4].map((p) =>
      el("button", {
        type: "button", class: "chip", "aria-pressed": String(state.players === p), disabled: locked,
        onclick: choose(() => { state.players = p; })
      }, [String(p)])));
    $("setupNote").textContent = locked ? "Start a new game to change this." : "";
  }

  let sheetKey = "";
  function buildSheet() {
    const n = sideCount();
    const key = state.mode + n;
    if (key === sheetKey) return;
    sheetKey = key;
    $("sheet").classList.toggle("many", n > 2);
    const head = $("sheetHead");
    head.style.gridTemplateColumns = "repeat(" + n + ", minmax(0, 1fr))";
    head.replaceChildren(...range(n).map((t) => {
      const input = el("input", { class: "name", id: "name" + t, maxlength: "24", "aria-label": (state.mode === "teams" ? "Team " : "Player ") + (t + 1) + " name" });
      input.addEventListener("input", () => { names()[t] = input.value; save(); render(); });
      return el("div", { class: "team", id: "team" + t }, [
        input,
        el("div", { class: "total num", id: "total" + t, text: "0" }),
        el("div", { class: "bar" }, [el("span", { id: "bar" + t, style: "width:0" })]),
        el("div", { class: "togo num", id: "togo" + t })
      ]);
    }));
  }

  function renderSheet(game) {
    buildSheet();
    const target = state.target;
    const n = sideCount();
    const lead = uniqueMax(game.totals);
    range(n).forEach((t) => {
      const total = game.totals[t];
      $("total" + t).textContent = total;
      $("bar" + t).style.width = Math.max(0, Math.min(100, (total / target) * 100)) + "%";
      $("togo" + t).textContent = total >= target ? "Reached " + target : (target - total) + " to go";
      $("team" + t).classList.toggle("leader", lead === t && total > 0);
      const nameInput = $("name" + t);
      if (document.activeElement !== nameInput) nameInput.value = names()[t];
    });

    const hang = $("hangNote");
    hang.hidden = !(game.carry > 0 && game.winner === null);
    hang.textContent = game.carry + " points are hanging and go to the winner of the next hand.";

    const banner = $("banner");
    const max = Math.max(...game.totals);
    if (game.winner !== null) {
      banner.hidden = false;
      const others = game.totals.filter((_, t) => t !== game.winner).join(", ");
      const verb = state.mode === "teams" ? " win " : " wins ";
      banner.replaceChildren(
        el("strong", { text: sideName(game.winner) + verb + game.totals[game.winner] + " to " + others }),
        el("button", { class: "btn primary", type: "button", text: "Play again", onclick: startNewGame })
      );
    } else if (max >= target) {
      banner.hidden = false;
      banner.replaceChildren(el("span", { text: "Tied at the top above " + target + ". Play another hand to decide it." }));
    } else {
      banner.hidden = true;
    }
  }

  function renderForm(game) {
    const over = game.winner !== null;
    const n = sideCount();
    $("handTitle").textContent = "Hand " + (state.hands.length + 1);

    $("bidderSeg").replaceChildren(...range(n).map((t) => el("button", {
      type: "button", class: "chip", "aria-pressed": String(draft.bidder === t),
      onclick: () => { draft.bidder = t; render(); }
    }, [sideName(t)])));

    $("contractSeg").replaceChildren(...Object.keys(CONTRACTS).map((key) => {
      const c = CONTRACTS[key];
      const kids = c.kind === "suit"
        ? [el("span", { class: "sym" + (c.red ? " red" : ""), text: c.sym, "aria-hidden": "true" }), c.label]
        : [c.label];
      return el("button", {
        type: "button", class: "chip", "aria-pressed": String(draft.contract === key),
        onclick: () => {
          const before = draftTotal();
          draft.contract = key;
          if (draftTotal() !== before) { draft.tricks = range(n).map(() => ""); draft.manual = range(n).map(() => false); }
          trimBelots();
          render();
        }
      }, kids);
    }));

    $("multSeg").replaceChildren(...[[1, "None"], [2, "Double ×2"], [4, "Redouble ×4"]].map(([m, label]) =>
      el("button", {
        type: "button", class: "chip", "aria-pressed": String(draft.mult === m),
        onclick: () => { draft.mult = m; render(); }
      }, [label])));

    const kind = draftKind();
    const total = draftTotal();
    const trump = trumpSuit(draft.contract);
    const belotLimit = kind === "suit" ? 1 : 4;
    const belotsUsed = draft.decl.reduce((s, l) => s + l.filter((x) => x === "b").length, 0);

    $("cols").replaceChildren(...range(n).map((t) => {
      const name = sideName(t);
      const capotOn = draft.capot === t;
      const trickVal = draft.capot !== null ? (capotOn ? total : 0) : draft.tricks[t];
      const input = el("input", {
        id: "tricks" + t, type: "number", inputmode: "numeric", min: "0", max: String(total), step: "1",
        placeholder: "0–" + total, value: trickVal, disabled: draft.capot !== null,
        "aria-label": name + " trick points"
      });
      input.addEventListener("input", () => {
        draft.tricks[t] = input.value;
        draft.manual[t] = input.value !== "";
        if (n === 2) draft.manual[1 - t] = false;
        autofillTricks(t);
        range(n).forEach((o) => { if (o !== t) { const other = $("tricks" + o); if (other) other.value = draft.tricks[o]; } });
        renderPreview(computeGame(state.hands, state.target, n));
      });

      const capot = el("label", { class: "capot", title: "Capot: one side takes all 8 tricks and gets 90 extra points" }, [
        el("input", {
          type: "checkbox", id: "capot" + t, checked: capotOn,
          onchange: (e) => { draft.capot = e.target.checked ? t : null; render(); }
        }),
        "Capot ", el("small", { text: "took all 8 tricks, +90" })
      ]);

      const declBtns = el("div", { class: "decl-btns" }, Object.keys(DECL).map((k) => {
        const isBelot = k === "b";
        const disabled = kind === "nt" || (isBelot && belotsUsed >= belotLimit);
        return el("button", {
          type: "button", disabled,
          title: kind === "nt" ? "No declarations in no trumps" : "Add " + DECL[k].long,
          "aria-label": "Add " + DECL[k].long + ", " + DECL[k].v + " points",
          onclick: () => { draft.decl[t].push(k); render(); }
        }, [cardIcons(k, trump), el("span", {}, [DECL[k].label + " ", el("small", { text: "+" + DECL[k].v })])]);
      }));

      const list = draft.decl[t].length && kind !== "nt"
        ? draft.decl[t].map((k, i) => el("span", { class: "tag" + (k === "b" ? " belot" : "") }, [
            cardIcons(k, trump),
            DECL[k].label + " " + DECL[k].v,
            el("button", {
              type: "button", "aria-label": "Remove " + DECL[k].label, text: "×",
              onclick: () => { draft.decl[t].splice(i, 1); render(); }
            })
          ]))
        : [el("span", { class: "empty-decl", text: kind === "nt" ? "No declarations in no trumps" : "No declarations" })];

      const trickRow = [input];
      if (n > 2 && draft.capot === null) {
        const sum = draft.tricks.reduce((s, x) => s + (Number(x) || 0), 0);
        if (t === n - 1) trickRow.push(el("span", { class: "remaining", text: (total - sum) + " left of " + total }));
      }

      return el("div", { class: "col" }, [
        el("h3", {}, [name, draft.bidder === t ? el("span", { class: "bidtag", text: "bid" }) : ""]),
        el("div", { class: "field" }, [el("span", { class: "label", text: "Trick points" }), el("div", { class: "tricks" }, trickRow)]),
        capot,
        el("div", { class: "field" }, [el("span", { class: "label", text: "Declarations" }), declBtns, el("div", { class: "decl-list" }, list)])
      ]);
    }));

    [...$("handForm").querySelectorAll("button, input")].forEach((node) => { if (over) node.disabled = true; });
    renderPreview(game);
  }

  function renderPreview(game) {
    const box = $("preview");
    const btn = $("addHand");
    if (game.winner !== null) {
      box.textContent = "Game over. Undo the last hand or start a new game.";
      btn.disabled = true;
      return;
    }
    const res = draftToHand();
    if (res.error) {
      box.textContent = res.error;
      btn.disabled = true;
      return;
    }
    btn.disabled = false;
    const r = scoreHand(res.hand);
    const statusText = { made: "Made", inside: "Inside", hanging: "Hanging" }[r.status];
    const parts = [el("span", { class: "status " + r.status, text: statusText })];
    r.pts.forEach((p, t) => {
      if (t) parts.push(" · ");
      parts.push(sideName(t) + " ", el("b", { text: String(p) }));
    });
    if (r.hang) parts.push(" · " + r.hang + " hanging");
    parts.push(el("span", { class: "hand-meta", text: "  (raw " + r.raw.join(" / ") + ")" }));
    box.replaceChildren(...parts);
  }

  function renderRows(game) {
    const n = sideCount();
    $("headRow").replaceChildren(
      el("th", { text: "#" }),
      el("th", { text: "Contract" }),
      ...range(n).map((t) => el("th", { class: "pts" + (t ? " sep" : ""), text: sideName(t), title: sideName(t) })),
      el("th", { class: "del" }, [el("span", { class: "sr", text: "Delete" })])
    );
    const body = $("rows");
    if (!game.rows.length) {
      body.replaceChildren(el("tr", {}, [el("td", { colspan: String(n + 3), class: "empty", text: "No hands yet. Fill in the first hand above and press Add hand." })]));
      return;
    }
    body.replaceChildren(...game.rows.map((row, i) => {
      const h = row.hand;
      const r = row.result;
      const meta = [r.status, "bid by " + sideName(h.bidder)];
      if (h.capot !== null) meta.push("capot by " + sideName(h.capot));
      h.decl.forEach((list, t) => {
        if (list.length) meta.push(sideName(t) + ": " + list.map((k) => DECL[k].label).join(", "));
      });
      if (row.carryIn) meta.push("+" + row.carryIn + " hanging to " + sideName(row.carryTo));
      if (r.hang) meta.push(r.hang + " left hanging");
      return el("tr", {}, [
        el("td", { class: "num", text: String(i + 1) }),
        el("td", {}, [el("div", { class: "hand-contract" }, [contractLabel(h)]), el("div", { class: "hand-meta", text: meta.join(" · ") })]),
        ...range(n).map((t) => el("td", { class: "pts num" + (t ? " sep" : "") }, [String(row.pts[t]), el("span", { class: "run", text: String(row.totals[t]) })])),
        el("td", { class: "del" }, [el("button", {
          type: "button", "aria-label": "Delete hand " + (i + 1), text: "×",
          onclick: () => { state.hands.splice(i, 1); save(); render(); }
        })])
      ]);
    }).reverse());
  }

  function renderTop() {
    const t = $("target");
    if (document.activeElement !== t) t.value = state.target;
    const box = $("newGameBox");
    if (confirmingNewGame) {
      box.replaceChildren(el("span", { class: "confirm" }, [
        "Clear all hands?",
        el("button", { class: "btn danger", type: "button", text: "Clear", onclick: startNewGame }),
        el("button", { class: "btn", type: "button", text: "Cancel", onclick: () => { confirmingNewGame = false; render(); } })
      ]));
    } else {
      box.replaceChildren(el("button", {
        class: "btn danger", type: "button", text: "New game", disabled: !state.hands.length,
        onclick: () => { confirmingNewGame = true; render(); }
      }));
    }
    $("undo").disabled = !state.hands.length;
  }

  function renderRules() {
    const row = (key) => [el("dt", {}, [cardIcons(key, "♥", true), el("span", { text: DECL[key].long })]), el("dd", { text: String(DECL[key].v) })];
    const plain = (label, v) => [el("dt", {}, [el("span"), el("span", { text: label })]), el("dd", { text: v })];
    const block = (title, kids) => el("div", {}, [el("h4", { text: title }), el("dl", {}, kids.flat())]);
    const p = (b, text) => el("p", {}, b ? [el("b", { text: b + " " }), text] : [text]);
    $("rulesGrid").replaceChildren(
      block("In a row (same suit)", [row("t"), row("q"), row("f")]),
      block("Four of a kind (carré)", [row("cj"), row("c9"), row("c4")]),
      block("Suit bonus and capot", [row("b"), plain("Capot, one side takes all 8 tricks", "90"), plain("Last trick", "10")]),
      block("Points in the cards", [plain("Suit (♣ ♦ ♥ ♠)", "162"), plain("All trumps", "258"), plain("No trumps, counted ×2", "130")]),
      el("div", { class: "rules-wide" }, [
        el("h4", { text: "How a hand is scored" }),
        p("", "Raw points are divided by 10 and rounded. In a suit game 7 and up rounds up (86 → 8, 87 → 9). In all trumps and no trumps 5 and up rounds up."),
        p("", "Sequences and belot are shown here in hearts; on the form they use the trump suit. Sequences count in any suit. No declarations or belot count in no trumps. In all trumps every K + Q pair counts as a belot."),
        p("Capot:", "when one side takes every trick (valat), it scores 90 extra raw points, which is 9 game points."),
        p("Inside:", "if the side that took the contract scores less than an opponent, it loses its points. With two teams the defenders get everything. With individual players the bidder's points are shared equally among the other players."),
        p("Hanging:", "on a tie, the opponents keep their points. The bidder's points carry over to whoever scores most in the next hand."),
        p("Double / redouble:", "if the contract is made the bidder takes every point of the hand. Everything is multiplied by 2 or 4."),
        p("Belot is never lost:", "it always stays with the side that called it. Enter only the declarations that count after comparing sequences at the table.")
      ])
    );
  }

  function render() {
    const game = computeGame(state.hands, state.target, sideCount());
    renderTop();
    renderSetup();
    renderSheet(game);
    renderForm(game);
    renderRows(game);
  }

  function trimBelots() {
    const kind = draftKind();
    if (kind === "nt") return;
    const limit = kind === "suit" ? 1 : 4;
    let seen = 0;
    draft.decl = draft.decl.map((list) => list.filter((k) => k !== "b" || ++seen <= limit));
  }

  function startNewGame() {
    state.hands = [];
    confirmingNewGame = false;
    draft = freshDraft();
    save();
    render();
  }

  // ---------- events ----------

  $("handForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const res = draftToHand();
    if (res.error) return;
    if (computeGame(state.hands, state.target, sideCount()).winner !== null) return;
    state.hands.push(res.hand);
    draft = freshDraft(draft);
    save();
    render();
  });

  $("undo").addEventListener("click", () => { state.hands.pop(); save(); render(); });

  $("target").addEventListener("change", (e) => {
    const v = parseInt(e.target.value, 10);
    state.target = Number.isFinite(v) && v > 0 ? v : 151;
    save();
    render();
  });

  renderRules();
  render();
})();
</script>
</body>
</html>
