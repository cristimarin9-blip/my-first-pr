<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabelă Belot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: o tabelă de hârtie împărțită pe coloane (câte una pentru fiecare jucător sau pereche), formularul rundei dedesubt, istoricul la final. */
:root {
  --bg: #eef1ee;
  --paper: #fbfcfa;
  --ink: #1b2421;
  --muted: #5d6b66;
  --line: #d3dbd7;
  --felt: #1f5a45;
  --felt-soft: #e1ede7;
  --on-felt: #ffffff;
  --red: #b3262e;
  --red-soft: #f7e3e4;
  --gold: #8a6510;
  --gold-soft: #f6ecd2;
  --card: #ffffff;
  --card-edge: #b9c4bf;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1412; --paper: #151f1c; --ink: #e5ece9; --muted: #96a59f; --line: #2a3833;
    --felt: #5bb38f; --felt-soft: #1b3229; --on-felt: #0d1412;
    --red: #ec7a7f; --red-soft: #3a1d20; --gold: #e0b75a; --gold-soft: #33290f;
    --card: #e9eeeb; --card-edge: #5d6b66;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1412; --paper: #151f1c; --ink: #e5ece9; --muted: #96a59f; --line: #2a3833;
  --felt: #5bb38f; --felt-soft: #1b3229; --on-felt: #0d1412;
  --red: #ec7a7f; --red-soft: #3a1d20; --gold: #e0b75a; --gold-soft: #33290f;
  --card: #e9eeeb; --card-edge: #5d6b66;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 20px 48px; padding-inline: 16px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.15rem; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--felt); outline-offset: 2px; }
.label { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; left: -9999px; }
[hidden] { display: none !important; }

/* Bara de sus */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.back { color: var(--muted); text-decoration: none; font-size: .88rem; font-weight: 600; }
.back:hover { color: var(--felt); }
.top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 14px; font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--felt); color: var(--on-felt); border-color: var(--felt); }
.btn.danger { color: var(--red); }

/* Setări */
.setup { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
.setup .field { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.setup-note { font-size: .82rem; color: var(--muted); }
.toggle { display: flex; align-items: center; gap: 6px; font-size: .9rem; cursor: pointer; }

/* Tabela */
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.sheet-head { display: grid; }
.team { padding: 16px 18px 14px; display: grid; gap: 6px; min-width: 0; }
.team + .team { border-left: 2px solid var(--ink); }
.team .name { font-weight: 600; font-size: .95rem; color: var(--muted); overflow-wrap: anywhere; }
.names { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; width: 100%; }
.names label { display: grid; gap: 4px; font-size: .78rem; color: var(--muted); }
.names input { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); min-width: 0; width: 100%; }
.total { font-family: var(--font-display); font-size: clamp(2.4rem, 10vw, 3.4rem); line-height: 1; }
.sheet.many .total { font-size: clamp(1.9rem, 8vw, 2.8rem); }
.sheet.many .team { padding: 14px 12px 12px; }
.bar { height: 6px; border-radius: 3px; background: var(--felt-soft); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--felt); transition: width .3s ease; }
.togo { font-size: .82rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.bt-count { color: var(--red); font-weight: 600; }
.team.leader .total { color: var(--felt); }
.banner {
  border-top: 1px solid var(--line); padding: 12px 18px; display: flex; gap: 12px; align-items: center;
  justify-content: space-between; flex-wrap: wrap; background: var(--felt-soft);
}
.banner strong { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; }
.limitnote { border-top: 1px solid var(--line); padding: 10px 18px; font-size: .88rem; background: var(--gold-soft); color: var(--gold); }

/* Formularul rundei */
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 18px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.field { display: grid; gap: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 7px 14px;
  font-weight: 600; display: inline-flex; align-items: center; gap: 6px; min-height: 38px;
}
.chip:hover:not(:disabled) { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--felt); color: var(--on-felt); border-color: var(--felt); }
.chip .sym { font-size: 1.15rem; line-height: 1; }
.chip .sym.red { color: var(--red); }
.chip[aria-pressed="true"] .sym.red { color: inherit; }
.chip:disabled { opacity: .4; cursor: not-allowed; }

.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.col { display: grid; gap: 10px; align-content: start; min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 8px; }
.col h3 { margin: 0; font-size: .95rem; font-weight: 700; overflow-wrap: anywhere; }
.col h3 .bidtag { font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--felt); margin-left: 6px; }
.tricks { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tricks input {
  width: 100%; max-width: 7em; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--paper); font-size: 1.15rem; font-variant-numeric: tabular-nums;
}
.remaining { font-size: .82rem; color: var(--muted); }

.decl-btns { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; }
.decl-btns button {
  border: 1px dashed var(--line); background: transparent; border-radius: 8px; padding: 7px 8px 6px;
  display: grid; gap: 5px; justify-items: start; text-align: left; font-size: .8rem; font-weight: 600; line-height: 1.2;
}
.decl-btns button:hover:not(:disabled) { border-style: solid; border-color: var(--felt); }
.decl-btns button:disabled { opacity: .35; cursor: not-allowed; }
.decl-btns button small { font-weight: 500; color: var(--muted); }
.decl-list { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; }
.tag {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; padding: 3px 4px 3px 6px;
  background: var(--felt-soft); font-size: .82rem; font-weight: 600;
}
.tag.bela { background: var(--red-soft); }
.tag.void { opacity: .55; text-decoration: line-through; }
.tag button { border: 0; background: transparent; padding: 0 4px; font-size: 1rem; line-height: 1; color: inherit; opacity: .7; }
.tag button:hover { opacity: 1; }
.empty-decl, .hint { font-size: .82rem; color: var(--muted); }

.penalty { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pen-btn { border: 1px dashed var(--line); background: transparent; border-radius: 8px; padding: 5px 10px; font-size: .85rem; font-weight: 700; color: var(--red); }
.pen-btn:hover:not(:disabled) { border-style: solid; border-color: var(--red); }
.pen-btn small { font-weight: 500; color: var(--muted); }
.tag.pen { background: var(--red-soft); color: var(--red); }
.nocards { font-size: .88rem; cursor: pointer; flex-wrap: nowrap; align-items: flex-start; }
.nocards input { margin-top: .2em; flex: none; }
.nocards b { color: var(--red); font-weight: 700; }
.nocards small { color: var(--muted); }

.special { display: grid; gap: 10px; padding: 12px; border: 1px dashed var(--line); border-radius: 8px; }
.special-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .9rem; }
.special-row .btn { padding: 6px 10px; font-size: .85rem; display: inline-flex; align-items: center; gap: 8px; }

/* Cărți desenate */
.cards { display: inline-flex; align-items: center; }
.card {
  display: inline-grid; grid-template-rows: auto auto; place-items: center; align-content: center;
  width: 2em; height: 2.3em; border: 1px solid var(--card-edge); border-radius: 3px;
  background: var(--card); color: #1b2421; font-size: .72rem; font-weight: 700; line-height: 1;
  box-shadow: 0 1px 0 rgba(0, 0, 0, .08); font-variant-numeric: tabular-nums;
}
.card + .card { margin-left: -.3em; }
.card.red { color: #b3262e; }
.card i { font-style: normal; font-size: .95em; }
.cards.lg .card { font-size: .85rem; }
.cards.lg .card + .card { margin-left: -.3em; }
.cards.tight .card + .card { margin-left: -.55em; }

.preview {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  border-top: 1px solid var(--line); padding-top: 14px;
}
.preview-text { font-size: .92rem; min-width: 0; }
.round-total { font-size: .92rem; padding: 10px 12px; border-radius: 8px; background: var(--felt-soft); }
.round-total b { font-variant-numeric: tabular-nums; color: var(--felt); }
.preview-text b { font-variant-numeric: tabular-nums; }
.status { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; margin-right: 6px; }
.status.ok { background: var(--felt-soft); color: var(--felt); }
.status.bt { background: var(--red-soft); color: var(--red); }
.status.other { background: var(--gold-soft); color: var(--gold); }

/* Istoric */
.ledger { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 8px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
td.pts, th.pts { text-align: right; white-space: nowrap; }
th.pts { max-width: 7em; overflow: hidden; text-overflow: ellipsis; }
td.pts .run { display: block; font-size: .78rem; color: var(--muted); }
.preview-text .before { color: var(--muted); text-decoration: line-through; font-variant-numeric: tabular-nums; }
td.pts .bt { color: var(--red); font-weight: 700; }
td.pts.sep, th.pts.sep { border-left: 2px solid var(--ink); }
.hand-contract { font-weight: 600; white-space: nowrap; }
.hand-contract .red { color: var(--red); }
.hand-meta { font-size: .8rem; color: var(--muted); min-width: 12em; }
td.del { width: 1%; }
td.del button { border: 0; background: transparent; color: var(--muted); padding: 2px 6px; font-size: 1.1rem; }
td.del button:hover { color: var(--red); }
.empty { padding: 24px 8px; color: var(--muted); text-align: center; }

details.rules { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; }
details.rules summary { cursor: pointer; font-family: var(--font-display); font-size: 1.05rem; }
.rules-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; margin-top: 14px; font-size: .9rem; }
.rules-grid h4 { margin: 0 0 8px; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.rules-grid dl { margin: 0; display: grid; grid-template-columns: auto 1fr auto; gap: 8px 10px; align-items: center; }
.rules-grid dt { display: contents; }
.rules-grid dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.rules-grid p { margin: 0 0 6px; max-width: 70ch; }
.rules-wide { grid-column: 1 / -1; }

.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .9rem; }

@media (max-width: 560px) {
  .team { padding: 14px 12px; }
  .panel { padding: 14px; }
  .sheet.many .team { padding: 12px 8px; }
  .sheet.many .togo { font-size: .74rem; }
}
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div style="display:grid;gap:2px">
      <a class="back" href="index.html">← Toate jocurile</a>
      <h1>Tabelă Belot</h1>
    </div>
    <div class="top-actions">
      <span id="newGameBox"></span>
    </div>
  </header>

  <section class="setup" aria-label="Setările jocului">
    <div class="field">
      <span class="label">Masa</span>
      <div class="seg" id="modeSeg"></div>
    </div>
    <div class="field">
      <span class="label">Jocul până la</span>
      <div class="seg" id="targetSeg"></div>
    </div>
    <div class="field" style="width:100%">
      <span class="label">Numele</span>
      <div class="names" id="namesBox"></div>
    </div>
    <label class="toggle" for="reduced"><input type="checkbox" id="reduced"> Combinații reduse</label>
    <span class="setup-note" id="setupNote"></span>
  </section>

  <section class="sheet" id="sheet" aria-label="Scor">
    <div class="sheet-head" id="sheetHead"></div>
    <div class="limitnote" id="limitNote" hidden></div>
    <div class="banner" id="banner" hidden></div>
  </section>

  <form class="panel" id="handForm" autocomplete="off">
    <div class="panel-head">
      <h2 id="handTitle">Runda 1</h2>
      <span class="label">Se completează după ultima mână</span>
    </div>

    <div class="field">
      <span class="label" id="bidderLabel">A ales cozul</span>
      <div class="seg" id="bidderSeg"></div>
    </div>

    <div class="field">
      <span class="label">Coz</span>
      <div class="seg" id="trumpSeg"></div>
    </div>

    <div class="field">
      <span class="label">Ultima mână a luat-o</span>
      <div class="seg" id="lastSeg"></div>
    </div>

    <div class="cols" id="cols"></div>

    <div class="special">
      <span class="label">Cazuri speciale</span>
      <label class="special-row" for="opt"><input type="checkbox" id="opt"> <span id="optCards"></span> Patru de opt la masă: se anulează combinațiile tuturor jucătorilor (în afară de Bela)</label>
      <div class="special-row" id="annulRow"></div>
      <div class="special-row" id="belotRow"></div>
      <div class="special-row" id="ruleRow"></div>
    </div>

    <div class="round-total" id="roundTotal"></div>

    <div class="preview">
      <div class="preview-text" id="preview" aria-live="polite"></div>
      <div class="top-actions">
        <button class="btn" id="cancelEdit" type="button" hidden>Renunță la editare</button>
        <button class="btn primary" id="addHand" type="submit">Adaugă runda</button>
      </div>
    </div>
  </form>

  <section class="panel" aria-labelledby="histTitle">
    <div class="panel-head">
      <h2 id="histTitle">Istoricul rundelor</h2>
      <div class="top-actions">
        <button class="btn" id="editLast" type="button">Editează ultima rundă</button>
        <button class="btn" id="undo" type="button">Șterge ultima rundă</button>
      </div>
    </div>
    <div class="ledger">
      <table>
        <thead><tr id="headRow"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <details class="rules" id="rules">
    <summary>Regulile de punctaj</summary>
    <div class="rules-grid" id="rulesGrid"></div>
  </details>
</div>

<script>
(function () {
  "use strict";

  const SUITS = {
    c: { label: "Cruce",   sym: "♣", red: false },
    d: { label: "Diamant", sym: "♦", red: true },
    h: { label: "Inimă",   sym: "♥", red: true },
    s: { label: "Cioară",  sym: "♠", red: false }
  };
  const ALL_SUITS = ["♠", "♥", "♦", "♣"];
  const CARD_TOTAL = 152; // punctele din cărți, fără ultima mână
  const LAST_TRICK = 10;  // ultima mână: 10 puncte (1 bilă), doar dacă n-o ia cel care a ales cozul
  // `cards(coz)` arată din ce cărți e făcută combinația, ca perechi [rang, culoare].
  const DECL = {
    t:  { label: "Terț",            long: "Terț, 3 cărți la rând de aceeași culoare",        v: 20,  big: false, cards: (s) => ["9", "10", "J"].map((r) => [r, s]) },
    j:  { label: "Jumate de sută",  long: "Jumate de sută, 4 cărți la rând",                 v: 50,  big: false, cards: (s) => ["9", "10", "J", "Q"].map((r) => [r, s]) },
    o:  { label: "O sută",          long: "O sută, 5 cărți la rând",                         v: 100, big: true,  cards: (s) => ["9", "10", "J", "Q", "K"].map((r) => [r, s]) },
    p4: { label: "Patru de 10/D/K/A", long: "Patru cărți de zece, dame, crai sau tuzi",      v: 100, big: true,  cards: () => ALL_SUITS.map((s) => ["A", s]) },
    p9: { label: "Patru de nouă",   long: "Patru cărți de nouă",                             v: 150, big: true,  cards: () => ALL_SUITS.map((s) => ["9", s]) },
    pv: { label: "Patru de valet",  long: "Patru cărți de valet",                            v: 200, big: true,  cards: () => ALL_SUITS.map((s) => ["J", s]) },
    b:  { label: "Bela",            long: "Bela, dama și craiul de coz",                     v: 20,  big: false, cards: (s) => [["Q", s], ["K", s]] }
  };
  const MODES = {
    "1v1": { label: "1 vs 1",       sides: 2, kind: "jucători", defaults: ["Jucătorul 1", "Jucătorul 2"] },
    "3":   { label: "În 3",         sides: 3, kind: "jucători", defaults: ["Jucătorul 1", "Jucătorul 2", "Jucătorul 3"] },
    "4":   { label: "În 4",         sides: 4, kind: "jucători", defaults: ["Jucătorul 1", "Jucătorul 2", "Jucătorul 3", "Jucătorul 4"] },
    "2v2": { label: "În perechi",   sides: 2, kind: "perechi",  defaults: ["Noi", "Voi"] }
  };
  const PENALTY = 10;      // bile
  const BT_LIMIT = 3;      // 3 BT-uri = −10 bile
  const STORE_KEY = "belot-moldova-v1";

  const $ = (id) => document.getElementById(id);
  const range = (n) => Array.from({ length: n }, (_, i) => i);
  const r1 = (x) => Math.round(x * 10) / 10;

  // ---------- punctaj ----------

  // Puncte → bile: 10 = 1, 35 = 3, 66 = 7 (5 se rotunjește în jos, 6 în sus).
  function toBile(points) {
    return Math.floor(points / 10) + (points % 10 >= 6 ? 1 : 0);
  }

  function scoreHand(h, mode) {
    const n = h.points ? h.points.length : MODES[mode].sides;
    const sides = range(n);
    if (h.type === "anulata" || h.type === "belot") {
      return { bile: sides.map(() => 0), raw: sides.map(() => 0), bt: false, status: h.type };
    }
    if (h.type === "incalcare") {
      // Încălcare de regulă: −10 bile pentru vinovat, runda se reia de la început.
      return { bile: sides.map((t) => (t === h.side ? -PENALTY : 0)), raw: sides.map(() => 0), bt: false, status: h.type };
    }
    // penalty[t] > 0: n-a luat nicio carte, deci −10 bile și nicio combinație a lui nu se socotește (nici Bela).
    const noCards = sides.map((t) => ((h.penalty || [])[t] || 0) > 0);
    const bela = sides.map((t) => noCards[t] ? 0 : h.decl[t].filter((x) => x === "b").length * DECL.b.v);
    const comb = sides.map((t) => h.opt || noCards[t] ? 0 : h.decl[t].filter((x) => x !== "b").reduce((s, x) => s + DECL[x].v, 0));
    const b = h.bidder;
    // Ultima mână: dacă o ia altcineva decât cel care a ales cozul, bila lui se socotește înainte de BT.
    // Rundele salvate înainte aveau ultima inclusă în puncte (162); cele noi o adaugă aici celui care a luat-o.
    const hasLast = h.points.reduce((s, x) => s + x, 0) === CARD_TOTAL;
    const extra = sides.map((t) => (hasLast && h.last === t && t !== b ? LAST_TRICK : 0));
    const raw = sides.map((t) => h.points[t] + comb[t] + bela[t] + extra[t]);
    const opps = sides.filter((t) => t !== b);
    let bile, bt;

    if (mode === "3" || mode === "4") {
      // Se adună bilele rotunjite ale celor care nu au jucat și se scad din totalul jocului.
      const game = toBile(raw.reduce((s, x) => s + x, 0));
      bile = sides.map((t) => (t === b ? 0 : toBile(raw[t])));
      bile[b] = game - opps.reduce((s, t) => s + bile[t], 0);
      // Întâi după bile, apoi (la egalitate de bile) după puncte.
      bt = opps.some((t) => bile[b] < bile[t] || (bile[b] === bile[t] && raw[b] < raw[t]));
    } else {
      bile = mode === "1v1" ? raw.map((x) => x / 10) : raw.map(toBile);
      bt = opps.some((t) => raw[b] < raw[t]);
    }
    // Ultima luată de cel care a ales cozul: nu contează la BT, dar rămâne în totalul rundei (16 bile).
    if (hasLast && h.last === b) {
      raw[b] += LAST_TRICK;
      if (mode === "3" || mode === "4") bile[b] = toBile(raw.reduce((s, x) => s + x, 0)) - opps.reduce((s, t) => s + bile[t], 0);
      else bile[b] = mode === "1v1" ? raw[b] / 10 : toBile(raw[b]);
    }
    const before = bile.slice();
    if (bt) {
      // BT: punctele celui care a ales cozul se împart între ceilalți. Bela îi rămâne lui.
      const share = (raw[b] - bela[b]) / opps.length;
      const after = sides.map((t) => (t === b ? bela[b] : raw[t] + share));
      bile = mode === "1v1" ? after.map((x) => x / 10) : after.map((x) => toBile(Math.round(x)));
    }
    bile = bile.map((x, t) => r1(x - (noCards[t] ? PENALTY : 0)));
    const beforeBt = before.map((x, t) => r1(x - (noCards[t] ? PENALTY : 0)));
    const sum = raw.reduce((s, x) => s + x, 0);
    return { bile, before: beforeBt, raw, bt, status: bt ? "bt" : "ok", total: mode === "1v1" ? sum / 10 : toBile(sum) };
  }

  // Parcurge rundele în ordine: totaluri, BT-uri, limita jocului și câștigătorul.
  function computeGame(hands, target, mode) {
    const n = MODES[mode].sides;
    let totals = range(n).map(() => 0);
    const bts = range(n).map(() => 0);
    let limit = target, winner = null, winBy = null;
    const raises = [];
    const rows = hands.map((h, i) => {
      const r = scoreHand(h, mode);
      const bile = r.bile.slice();
      let btPenalty = false;
      if (r.bt) {
        bts[h.bidder]++;
        if (bts[h.bidder] % BT_LIMIT === 0) { bile[h.bidder] = r1(bile[h.bidder] - PENALTY); btPenalty = true; }
      }
      totals = totals.map((x, t) => r1(x + bile[t]));
      if (winner === null) {
        if (h.type === "belot") { winner = h.side; winBy = "belot"; }
        else {
          let over = range(n).filter((t) => totals[t] > limit);
          while (over.length > 1) {
            limit += 50;
            raises.push({ hand: i, limit });
            over = range(n).filter((t) => totals[t] > limit);
          }
          if (over.length === 1) { winner = over[0]; winBy = "bile"; }
        }
      }
      return { hand: h, result: r, bile, btPenalty, totals: totals.slice(), bts: bts.slice() };
    });
    return { rows, totals, bts, limit, raises, winner, winBy };
  }

  // ---------- stare ----------

  let state = {
    mode: "2v2", target: 51, reduced: false, hands: [],
    names: { "1v1": MODES["1v1"].defaults.slice(), "3": MODES["3"].defaults.slice(), "4": MODES["4"].defaults.slice(), "2v2": MODES["2v2"].defaults.slice() }
  };
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (saved && Array.isArray(saved.hands) && MODES[saved.mode]) {
      saved.names = Object.assign({}, state.names, saved.names || {});
      state = Object.assign(state, saved);
    }
  } catch (e) { /* fără stocare: începem de la zero */ }

  function mode() { return MODES[state.mode]; }
  function sideCount() { return mode().sides; }
  function sideName(t) { return (state.names[state.mode][t] || "").trim() || mode().defaults[t]; }
  function fmt(x) { return state.mode === "1v1" ? x.toFixed(1).replace(".", ",") : String(x); }

  function freshDraft(prev) {
    const n = sideCount();
    return {
      bidder: prev && prev.bidder < n ? prev.bidder : 0,
      trump: prev ? prev.trump : "h",
      points: range(n).map(() => ""),
      manual: range(n).map(() => false),
      decl: range(n).map(() => []),
      penalty: range(n).map(() => 0),
      opt: false,
      last: null
    };
  }

  let draft = freshDraft();
  let confirmingNewGame = false;
  let editing = false; // se editează ultima rundă

  // Rundele de dinaintea celei din formular (fără ultima când o editezi).
  function baseHands() { return editing ? state.hands.slice(0, -1) : state.hands; }

  function handToDraft(h) {
    const n = sideCount();
    if (h.type !== "normala") return freshDraft(draft);
    return {
      bidder: h.bidder, trump: h.trump,
      points: h.points.map(String), manual: range(n).map(() => true),
      decl: h.decl.map((l) => l.slice()), penalty: (h.penalty || range(n).map(() => 0)).slice(),
      opt: !!h.opt, last: h.last != null ? h.last : null
    };
  }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignorăm */ }
  }

  // Câte combinații de 100+ a arătat fiecare jucător în rundele anterioare (pentru combinațiile reduse).
  function bigCombosShown() {
    const n = sideCount();
    const count = range(n).map(() => 0);
    baseHands().forEach((h) => {
      if (h.type !== "normala" || h.opt) return;
      h.decl.forEach((list, t) => { if (!((h.penalty || [])[t] > 0)) count[t] += list.filter((k) => DECL[k].big).length; });
    });
    return count;
  }

  function draftToHand() {
    const n = sideCount();
    if (draft.points.every((x) => x === "")) return { error: "Introduceți punctele din cărți." };
    const points = draft.points.map((x) => (x === "" ? 0 : Number(x)));
    if (points.some((x) => !Number.isInteger(x) || x < 0)) return { error: "Punctele trebuie să fie numere întregi." };
    const sum = points.reduce((s, x) => s + x, 0);
    if (sum !== CARD_TOTAL) return { error: "Punctele din cărți trebuie să dea " + CARD_TOTAL + " (acum " + sum + ")." };
    if (draft.last === null) return { error: "Alegeți cine a luat ultima mână." };
    return {
      hand: {
        type: "normala",
        bidder: draft.bidder,
        trump: draft.trump,
        points,
        decl: draft.decl.map((l) => l.slice()),
        penalty: draft.penalty.slice(),
        opt: draft.opt,
        last: draft.last
      }
    };
  }

  // Ultima căsuță se completează singură când toate celelalte au un număr.
  function autofillPoints(changed) {
    const n = sideCount();
    const open = range(n).filter((t) => !draft.manual[t]);
    if (open.length === 1) {
      const last = open[0];
      const sum = range(n).filter((t) => t !== last).reduce((s, t) => s + (Number(draft.points[t]) || 0), 0);
      draft.points[last] = String(Math.max(0, CARD_TOTAL - sum));
    } else {
      open.forEach((t) => { if (t !== changed) draft.points[t] = ""; });
    }
  }

  // ---------- ajutoare pentru afișare ----------

  function el(tag, attrs, children) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
    }
    (children || []).forEach((c) => n.append(c));
    return n;
  }

  function cardRow(list, extra) {
    return el("span", { class: "cards" + (extra ? " " + extra : ""), "aria-hidden": "true" }, list.map(([rank, suit]) =>
      el("span", { class: "card" + (suit === "♥" || suit === "♦" ? " red" : "") }, [rank, el("i", { text: suit })])));
  }
  function cardIcons(key, trump, large) { return cardRow(DECL[key].cards(trump), large ? "lg" : ""); }
  const fourOf = (rank) => ALL_SUITS.map((s) => [rank, s]);
  const allTrumps = (s) => ["7", "8", "9", "10", "J", "Q", "K", "A"].map((r) => [r, s]);

  function trumpLabel(key) {
    const s = SUITS[key];
    const frag = document.createDocumentFragment();
    frag.append(el("span", { class: s.red ? "red" : "", text: s.sym + " " }), s.label);
    return frag;
  }

  // ---------- afișare ----------

  function renderSetup() {
    const locked = state.hands.length > 0;
    const choose = (fn) => () => { fn(); draft = freshDraft(draft); save(); render(); };
    $("modeSeg").replaceChildren(...Object.keys(MODES).map((m) =>
      el("button", {
        type: "button", class: "chip", "aria-pressed": String(state.mode === m), disabled: locked,
        onclick: choose(() => { state.mode = m; })
      }, [MODES[m].label])));
    $("targetSeg").replaceChildren(...[51, 101].map((v) =>
      el("button", {
        type: "button", class: "chip", "aria-pressed": String(state.target === v), disabled: locked,
        onclick: choose(() => { state.target = v; })
      }, [v + " bile"])));
    buildNames();
    $("reduced").checked = state.reduced;
    $("reduced").disabled = locked;
    $("setupNote").textContent = locked ? "Pentru a schimba setările începeți un joc nou." : "";
  }

  // Numele se pot schimba oricând, și în timpul jocului.
  let namesKey = "";
  function buildNames() {
    if (namesKey === state.mode) return;
    namesKey = state.mode;
    $("namesBox").replaceChildren(...range(sideCount()).map((t) => {
      const input = el("input", { id: "nameInput" + t, maxlength: "24", placeholder: mode().defaults[t],
        value: state.names[state.mode][t] === mode().defaults[t] ? "" : state.names[state.mode][t] });
      input.addEventListener("input", () => { state.names[state.mode][t] = input.value; save(); render(); });
      return el("label", { for: "nameInput" + t }, [mode().defaults[t], input]);
    }));
  }

  let sheetKey = "";
  function buildSheet() {
    const n = sideCount();
    if (sheetKey === state.mode) return;
    sheetKey = state.mode;
    $("sheet").classList.toggle("many", n > 2);
    const head = $("sheetHead");
    head.style.gridTemplateColumns = "repeat(" + n + ", minmax(0, 1fr))";
    head.replaceChildren(...range(n).map((t) => {
      return el("div", { class: "team", id: "team" + t }, [
        el("div", { class: "name", id: "name" + t }),
        el("div", { class: "total num", id: "total" + t, text: "0" }),
        el("div", { class: "bar" }, [el("span", { id: "bar" + t, style: "width:0" })]),
        el("div", { class: "togo num", id: "togo" + t })
      ]);
    }));
  }

  function uniqueMax(arr) {
    const m = Math.max(...arr);
    return arr.filter((x) => x === m).length === 1 ? arr.indexOf(m) : null;
  }

  function renderSheet(game) {
    buildSheet();
    const n = sideCount();
    const lead = uniqueMax(game.totals);
    range(n).forEach((t) => {
      const total = game.totals[t];
      $("total" + t).textContent = fmt(total);
      $("bar" + t).style.width = Math.max(0, Math.min(100, (total / game.limit) * 100)) + "%";
      const left = r1(game.limit - total);
      const kids = [el("span", { text: total > game.limit ? "Peste " + game.limit : "mai are " + fmt(left) + " bile" })];
      if (game.bts[t]) kids.push(el("span", { class: "bt-count", text: "BT: " + (game.bts[t] % BT_LIMIT) + "/" + BT_LIMIT }));
      $("togo" + t).replaceChildren(...kids);
      $("team" + t).classList.toggle("leader", lead === t && total > 0);
      $("name" + t).textContent = sideName(t);
    });

    const note = $("limitNote");
    note.hidden = game.limit === state.target;
    note.textContent = "Mai mulți jucători au trecut de limită, așa că limita jocului a crescut la " + game.limit + " bile.";

    const banner = $("banner");
    if (game.winner !== null) {
      banner.hidden = false;
      const others = game.totals.filter((_, t) => t !== game.winner).map(fmt).join(", ");
      const text = game.winBy === "belot"
        ? sideName(game.winner) + " câștigă cu combinația BELOT"
        : sideName(game.winner) + " câștigă cu " + fmt(game.totals[game.winner]) + " la " + others;
      banner.replaceChildren(
        el("strong", { text }),
        el("button", { class: "btn primary", type: "button", text: "Joc nou", onclick: startNewGame })
      );
    } else {
      banner.hidden = true;
    }
  }

  function renderForm() {
    const game = computeGame(baseHands(), state.target, state.mode);
    const over = game.winner !== null;
    const n = sideCount();
    $("handTitle").textContent = editing ? "Editezi runda " + state.hands.length : "Runda " + (state.hands.length + 1);
    $("addHand").textContent = editing ? "Salvează runda" : "Adaugă runda";
    $("cancelEdit").hidden = !editing;
    $("bidderLabel").textContent = state.mode === "2v2" ? "Perechea care a ales cozul" : "A ales cozul";

    $("bidderSeg").replaceChildren(...range(n).map((t) => el("button", {
      type: "button", class: "chip", "aria-pressed": String(draft.bidder === t),
      onclick: () => { draft.bidder = t; render(); }
    }, [sideName(t)])));

    $("trumpSeg").replaceChildren(...Object.keys(SUITS).map((key) => {
      const s = SUITS[key];
      return el("button", {
        type: "button", class: "chip", "aria-pressed": String(draft.trump === key),
        onclick: () => { draft.trump = key; render(); }
      }, [el("span", { class: "sym" + (s.red ? " red" : ""), text: s.sym, "aria-hidden": "true" }), s.label]);
    }));

    $("lastSeg").replaceChildren(...range(n).map((t) => el("button", {
      type: "button", class: "chip", "aria-pressed": String(draft.last === t),
      onclick: () => { draft.last = t; render(); }
    }, [sideName(t)])));

    const trump = SUITS[draft.trump].sym;
    const belaUsed = draft.decl.reduce((s, l) => s + l.filter((x) => x === "b").length, 0);
    const shown = bigCombosShown();

    $("cols").replaceChildren(...range(n).map((t) => {
      const name = sideName(t);
      const input = el("input", {
        id: "points" + t, type: "number", inputmode: "numeric", min: "0", max: String(CARD_TOTAL), step: "1",
        placeholder: "0–" + CARD_TOTAL, value: draft.points[t], "aria-label": "Punctele din cărți pentru " + name
      });
      input.addEventListener("input", () => {
        draft.points[t] = input.value;
        draft.manual[t] = input.value !== "";
        if (n === 2) draft.manual[1 - t] = false;
        autofillPoints(t);
        range(n).forEach((o) => { if (o !== t) { const other = $("points" + o); if (other) other.value = draft.points[o]; } });
        renderPreview(computeGame(baseHands(), state.target, state.mode));
      });

      const bigBlocked = state.reduced && shown[t] >= 2;
      const declBtns = el("div", { class: "decl-btns" }, Object.keys(DECL).map((k) => {
        const disabled = (k === "b" && belaUsed >= 1) || (DECL[k].big && bigBlocked);
        return el("button", {
          type: "button", disabled,
          title: DECL[k].big && bigBlocked ? "Combinații reduse: a arătat deja două combinații de 100+" : "Adaugă " + DECL[k].long,
          "aria-label": "Adaugă " + DECL[k].long + ", " + DECL[k].v / 10 + " bile",
          onclick: () => { draft.decl[t].push(k); render(); }
        }, [cardIcons(k, trump), el("span", {}, [DECL[k].label + " ", el("small", { text: "+" + DECL[k].v / 10 + " bile" })])]);
      }));

      const list = draft.decl[t].length
        ? draft.decl[t].map((k, i) => el("span", { class: "tag" + (k === "b" ? " bela" : "") + (draft.penalty[t] || (draft.opt && k !== "b") ? " void" : "") }, [
            cardIcons(k, trump),
            DECL[k].label + " +" + DECL[k].v / 10,
            el("button", {
              type: "button", "aria-label": "Șterge " + DECL[k].label, text: "×",
              onclick: () => { draft.decl[t].splice(i, 1); render(); }
            })
          ]))
        : [el("span", { class: "empty-decl", text: "Fără combinații" })];

      const pointsRow = [input, el("span", { class: "remaining", id: "bileOf" + t })];
      if (n > 2 && t === n - 1) {
        const sum = draft.points.reduce((s, x) => s + (Number(x) || 0), 0);
        pointsRow.push(el("span", { class: "remaining", text: "au rămas " + (CARD_TOTAL - sum) + " din " + CARD_TOTAL }));
      }

      const declKids = [el("span", { class: "label", text: "Combinații" }), declBtns, el("div", { class: "decl-list" }, list)];
      if (state.reduced) declKids.push(el("span", { class: "hint", text: "Combinații de 100+ arătate: " + shown[t] + (bigBlocked ? " (nu mai poate arăta altele)" : " din 2") }));

      return el("div", { class: "col" }, [
        el("h3", {}, [name, draft.bidder === t ? el("span", { class: "bidtag", text: "a ales cozul" }) : ""]),
        el("div", { class: "field" }, [el("span", { class: "label", text: "Puncte din cărți (fără ultima)" }), el("div", { class: "tricks" }, pointsRow)]),
        el("div", { class: "field" }, declKids),
        el("label", { class: "penalty nocards", for: "nocards" + t }, [
          el("input", {
            type: "checkbox", id: "nocards" + t, checked: draft.penalty[t] > 0,
            onchange: (e) => { draft.penalty[t] = e.target.checked ? 1 : 0; render(); }
          }),
          el("span", {}, [el("b", { text: "N-a luat nicio carte " }), el("small", { text: "−10 bile, nicio combinație nu se socotește (nici Bela)" })])
        ])
      ]);
    }));

    $("opt").checked = draft.opt;
    $("optCards").replaceChildren(cardRow(fourOf("8"), "tight"));
    $("annulRow").replaceChildren(el("button", {
      type: "button", class: "btn", onclick: () => addSpecial({ type: "anulata" })
    }, [cardRow(fourOf("7"), "tight"), "Patru de șapte: runda se anulează"]));
    $("belotRow").replaceChildren(
      cardRow(allTrumps(trump), "tight"),
      el("span", { text: "Combinația BELOT, câștig instant:" }),
      ...range(n).map((t) => el("button", {
        type: "button", class: "btn", text: sideName(t), onclick: () => addSpecial({ type: "belot", side: t })
      }))
    );

    $("ruleRow").replaceChildren(
      el("span", { class: "pen-label", text: "Încălcare de regulă (−10 bile, se începe o rundă nouă):" }),
      ...range(n).map((t) => el("button", {
        type: "button", class: "btn danger", text: sideName(t), onclick: () => addSpecial({ type: "incalcare", side: t })
      }))
    );

    [...$("handForm").querySelectorAll("button, input")].forEach((node) => { if (over) node.disabled = true; });
    if (!over) $("opt").disabled = false;
    $("cancelEdit").disabled = false;
    renderPreview(game);
  }

  // Din câte bile e runda: 16 din cărți, plus combinațiile, plus bila pentru ultima.
  function renderRoundTotal() {
    const n = sideCount();
    const one = state.mode === "1v1";
    range(n).forEach((t) => {
      const span = $("bileOf" + t);
      const v = draft.points[t];
      const withLast = draft.last === t && t !== draft.bidder;
      const pts = Number(v) + (withLast ? LAST_TRICK : 0);
      if (span) span.textContent = v === "" || !Number.isFinite(Number(v)) ? "" : "= " + fmt(one ? pts / 10 : toBile(pts)) + " bile" + (withLast ? " cu ultima" : "");
    });
    const parts = [];
    const lastCounts = draft.last !== null && draft.last !== draft.bidder;
    let sum = CARD_TOTAL + LAST_TRICK;
    range(n).forEach((t) => draft.decl[t].forEach((k) => {
      if (draft.penalty[t] || (k !== "b" && draft.opt)) return;
      sum += DECL[k].v;
      parts.push("+ " + DECL[k].v / 10 + " " + DECL[k].label + " (" + sideName(t) + ")");
    }));
    const total = one ? sum / 10 : toBile(sum);
    $("roundTotal").replaceChildren(
      "Runda e din ", el("b", { text: fmt(total) + " bile" }),
      ": " + fmt(one ? (CARD_TOTAL + LAST_TRICK) / 10 : toBile(CARD_TOTAL + LAST_TRICK)) + " din cărți cu ultima " +
        (draft.last === null ? "(alegeți cine a luat-o)"
          : lastCounts ? "(luată de " + sideName(draft.last) + ", contează la BT)"
          : "(luată de cel care a ales cozul, nu contează la BT)") + " " + parts.join(" ")
    );
  }

  function renderPreview(game) {
    renderRoundTotal();
    const box = $("preview");
    const btn = $("addHand");
    if (game.winner !== null) {
      box.textContent = "Jocul s-a terminat. Editați sau ștergeți ultima rundă, sau începeți un joc nou.";
      btn.disabled = true;
      return;
    }
    const res = draftToHand();
    if (res.error) { box.textContent = res.error; btn.disabled = true; return; }
    btn.disabled = false;
    const r = scoreHand(res.hand, state.mode);
    const parts = [el("span", { class: "status " + r.status, text: r.bt ? "BT" : "A făcut" })];
    r.bile.forEach((p, t) => {
      if (t) parts.push(" · ");
      parts.push(sideName(t) + " ");
      if (r.bt) parts.push(el("span", { class: "before", text: fmt(r.before[t]) }), " → ");
      parts.push(el("b", { text: fmt(p) }));
    });
    parts.push(el("span", { class: "hand-meta", text: "  (în puncte: " + r.raw.join(" / ") + ")" }));
    box.replaceChildren(...parts);
  }

  function renderRows(game) {
    const n = sideCount();
    $("headRow").replaceChildren(
      el("th", { text: "#" }),
      el("th", { text: "Runda" }),
      ...range(n).map((t) => el("th", { class: "pts" + (t ? " sep" : ""), text: sideName(t), title: sideName(t) })),
      el("th", { class: "del" }, [el("span", { class: "sr", text: "Șterge" })])
    );
    const body = $("rows");
    if (!game.rows.length) {
      body.replaceChildren(el("tr", {}, [el("td", { colspan: String(n + 3), class: "empty", text: "Încă nu sunt runde. Completați prima rundă mai sus și apăsați Adaugă runda." })]));
      return;
    }
    body.replaceChildren(...game.rows.map((row, i) => {
      const h = row.hand;
      const r = row.result;
      let title, meta = [];
      if (h.type === "anulata") { title = "Rundă anulată"; meta.push("patru de șapte, cărțile se dau din nou"); }
      else if (h.type === "belot") { title = "Combinația BELOT"; meta.push(sideName(h.side) + " câștigă instant"); }
      else if (h.type === "incalcare") { title = "Încălcare de regulă"; meta.push(sideName(h.side) + " −" + PENALTY + " bile, runda se reia"); }
      else {
        title = trumpLabel(h.trump);
        meta.push("din " + fmt(r.total) + " bile", "cozul ales de " + sideName(h.bidder));
        if (h.last != null) meta.push("ultima: " + sideName(h.last) + (h.last === h.bidder ? " (nu contează la BT)" : " (+1 bilă înainte de BT)"));
        if (r.bt) meta.push("BT");
        if (row.btPenalty) meta.push("al " + BT_LIMIT + "-lea BT: −" + PENALTY + " bile");
        if (h.opt) meta.push("patru de opt: combinațiile anulate");
        h.decl.forEach((list, t) => { if (list.length) meta.push(sideName(t) + ": " + list.map((k) => DECL[k].label).join(", ")); });
        (h.penalty || []).forEach((c, t) => { if (c) meta.push(sideName(t) + " n-a luat nicio carte: −" + PENALTY + " bile, fără combinații"); });
      }
      game.raises.filter((x) => x.hand === i).forEach((x) => meta.push("limita crește la " + x.limit));
      return el("tr", {}, [
        el("td", { class: "num", text: String(i + 1) }),
        el("td", {}, [el("div", { class: "hand-contract" }, [title]), el("div", { class: "hand-meta", text: meta.join(" · ") })]),
        ...range(n).map((t) => {
          const isBt = r.bt && h.bidder === t;
          return el("td", { class: "pts num" + (t ? " sep" : "") }, [
            isBt ? el("span", { class: "bt", text: "BT " }) : "",
            fmt(row.bile[t]),
            r.bt ? el("span", { class: "run", text: "înainte " + fmt(r.before[t]) }) : "",
            el("span", { class: "run", text: fmt(row.totals[t]) })
          ]);
        }),
        el("td", { class: "del" }, [el("button", {
          type: "button", "aria-label": "Șterge runda " + (i + 1), text: "×",
          onclick: () => { state.hands.splice(i, 1); editing = false; save(); render(); }
        })])
      ]);
    }).reverse());
  }

  function renderTop() {
    const box = $("newGameBox");
    if (confirmingNewGame) {
      box.replaceChildren(el("span", { class: "confirm" }, [
        "Ștergeți toate rundele?",
        el("button", { class: "btn danger", type: "button", text: "Șterge", onclick: startNewGame }),
        el("button", { class: "btn", type: "button", text: "Renunță", onclick: () => { confirmingNewGame = false; render(); } })
      ]));
    } else {
      box.replaceChildren(el("button", {
        class: "btn danger", type: "button", text: "Joc nou", disabled: !state.hands.length,
        onclick: () => { confirmingNewGame = true; render(); }
      }));
    }
    $("undo").disabled = !state.hands.length || editing;
    $("editLast").disabled = !state.hands.length || editing;
  }

  function renderRules() {
    const row = (key) => [el("dt", {}, [cardIcons(key, "♥", true), el("span", { text: DECL[key].long })]), el("dd", { text: DECL[key].v / 10 + " bile" })];
    const cardsRow = (cards, label, v) => [el("dt", {}, [cardRow(cards, "lg tight"), el("span", { text: label })]), el("dd", { text: v })];
    const plain = (label, v) => [el("dt", {}, [el("span"), el("span", { text: label })]), el("dd", { text: v })];
    const block = (title, kids) => el("div", {}, [el("h4", { text: title }), el("dl", {}, kids.flat())]);
    const p = (b, text) => el("p", {}, b ? [el("b", { text: b + " " }), text] : [text]);
    $("rulesGrid").replaceChildren(
      block("Combinații la rând (aceeași culoare)", [row("t"), row("j"), row("o")]),
      block("Patru cărți de același fel", [row("p4"), row("p9"), row("pv")]),
      block("Bela și cazuri speciale", [
        row("b"),
        cardsRow(allTrumps("♥"), "Combinația BELOT, toți cozii de la 7 la A", "câștig instant"),
        cardsRow(fourOf("7"), "Patru de șapte", "runda se anulează"),
        cardsRow(fourOf("8"), "Patru de opt", "anulează combinațiile")
      ]),
      block("Valoarea cărților", [
        plain("Șapte, opt, nouă", "0"), plain("Nouă de coz", "14"), plain("Zece", "10"),
        plain("Valet", "2"), plain("Valet de coz", "20"), plain("Damă", "3"), plain("Crai", "4"), plain("Tuz", "11"),
        plain("Ultima mână", "+10")
      ]),
      el("div", { class: "rules-wide" }, [
        el("h4", { text: "Cum se calculează bilele" }),
        p("Puncte în bile:", "10 puncte = 1 bilă, 35 puncte = 3 bile, 66 puncte = 7 bile. 5 se rotunjește în jos, 6 în sus."),
        p("Din câte bile e runda:", "cărțile dau 152 de puncte, plus 10 pentru ultima mână: 162 de puncte, adică 16 bile. Fiecare combinație ridică totalul: un terț și o bela fac runda din 16 + 2 + 2 = 20 de bile."),
        p("1 vs 1:", "în tabelă se scriu bilele nerotunjite, adică punctele împărțite la 10 (de exemplu 6,4)."),
        p("În perechi:", "fiecare pereche primește bilele rotunjite ale punctelor sale. Dacă punctele sunt egale, bilele se împart egal (106 la 106 înseamnă 11 la 11). Nu există sistemul „ouălelor”."),
        p("În 3 și în 4:", "se adună bilele rotunjite ale celor care nu au jucat și se scad din totalul jocului. Restul îi revine celui care a jucat. Exemplu: X joacă cu 64 de puncte, Y are 53, Z are 65. Jocul e din 18 bile (182 de puncte), Y primește 5, Z primește 6, iar X primește 18 − 11 = 7 bile. Se compară întâi bilele, apoi, la egalitate de bile, punctele."),
        p("BT:", "dacă cel care a ales cozul are mai puțin decât un adversar, i se scrie BT. Punctele lui se împart în mod egal între ceilalți jucători, iar el păstrează doar Bela. La fiecare al treilea BT (3, 6, 9...) jucătorul primește −10."),
        p("Ultima mână:", "valorează 10 puncte (1 bilă) și face parte din cele 16 bile ale rundei. Dacă o ia altcineva decât cel care a ales cozul, bila i se adaugă înainte de a stabili BT-ul. Dacă o ia cel care a ales cozul, nu contează când se stabilește BT-ul, dar rămâne în totalul rundei. Punctele din cărți se scriu fără ultima (152 în total)."),
        p("Bela", "rămâne celui care o are, chiar și cu BT. Se pierde doar dacă jucătorul nu ia nicio carte."),
        p("Combinațiile", "se adaugă la punctele totale ale rundei, în afară de cazul în care jucătorul care le are nu ia nicio carte. Atunci primește −10 bile și nicio combinație a lui nu se socotește, nici Bela."),
        p("Încălcare de regulă:", "jucătorul care încalcă o regulă primește −10 bile, iar runda se reia de la început (se scrie ca o rundă separată, fără alte puncte)."),
        p("Combinații egale:", "dacă doi jucători au combinații identice, ele se anulează. Combinația în culoarea cozului are prioritate. Hotărâți la masă care combinații se socotesc."),
        p("Combinații reduse:", "fiecare jucător poate arăta cel mult două combinații de 100 de puncte sau mai mari într-un joc. Dacă într-o rundă îi vine o combinație dublă (de exemplu KKKK + QQQQ), se socotesc toate, apoi nu mai poate arăta altele."),
        p("Sfârșitul jocului:", "jocul continuă până când un jucător are mai mult de 51 (sau 101) bile. Dacă mai mulți trec de limită în aceeași rundă, limita crește cu 50 de bile (101, 151, 201 etc.).")
      ])
    );
  }

  function render() {
    const game = computeGame(state.hands, state.target, state.mode);
    renderTop();
    renderSetup();
    renderSheet(game);
    renderForm();
    renderRows(game);
  }

  function addSpecial(hand) {
    if (computeGame(baseHands(), state.target, state.mode).winner !== null) return;
    if (editing) state.hands[state.hands.length - 1] = hand;
    else state.hands.push(hand);
    editing = false;
    draft = freshDraft(draft);
    save();
    render();
  }

  function startNewGame() {
    state.hands = [];
    confirmingNewGame = false;
    editing = false;
    draft = freshDraft();
    save();
    render();
  }

  // ---------- evenimente ----------

  $("handForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const res = draftToHand();
    if (res.error) return;
    addSpecial(res.hand);
  });

  $("undo").addEventListener("click", () => { state.hands.pop(); save(); render(); });
  $("editLast").addEventListener("click", () => {
    if (!state.hands.length) return;
    editing = true;
    draft = handToDraft(state.hands[state.hands.length - 1]);
    render();
    $("handForm").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $("cancelEdit").addEventListener("click", () => { editing = false; draft = freshDraft(draft); render(); });
  $("opt").addEventListener("change", (e) => { draft.opt = e.target.checked; render(); });
  $("reduced").addEventListener("change", (e) => { state.reduced = e.target.checked; save(); render(); });

  renderRules();
  render();
})();
</script>
</body>
</html>
